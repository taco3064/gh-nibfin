name: CLI CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Run retained CLI and provider tests with networking denied
        run: python3 tooling/check.py
      - name: Verify the immutable installed Core observation contract offline
        run: node docs/handoffs/n15/verify.mjs
