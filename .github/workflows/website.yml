name: Website
# Deploys the public website (dashboard/src/app/) to GitHub Pages. Runs only when the
# site, the shared components or the npm project change, so a Go-only merge does not
# redeploy it. It triggers on push, so Nibfin waits for it as CD.
on:
  push:
    branches: [main]
    paths:
      - dashboard/src/app/**
      - dashboard/src/components/**
      - dashboard/src/lib/**
      - dashboard/src/styles/**
      - dashboard/astro.config.mjs
      - dashboard/package.json
      - dashboard/package-lock.json
      - .github/workflows/website.yml
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Every step is skipped until the site exists (#362), so the run stays green.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: hashFiles('dashboard/astro.config.mjs') != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        if: hashFiles('dashboard/astro.config.mjs') != ''
        working-directory: dashboard
        run: npm ci
      - name: Build
        if: hashFiles('dashboard/astro.config.mjs') != ''
        working-directory: dashboard
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: hashFiles('dashboard/astro.config.mjs') != ''
        with:
          path: dashboard/dist-site
      - id: deployment
        if: hashFiles('dashboard/astro.config.mjs') != ''
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
