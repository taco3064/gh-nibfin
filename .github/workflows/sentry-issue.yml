name: Sentry issue
# Files a `request` Issue for each `sentry-issue` dispatch from the Sentry relay Worker (#482).
# The program reads the payload from GITHUB_EVENT_PATH, so no client_payload expression
# appears here. queue: max keeps every event and serializes the deduplication and daily cap.
run-name: Sentry issue
on:
  repository_dispatch:
    types: [sentry-issue]
permissions: {}
concurrency:
  group: sentry-issue
  cancel-in-progress: false
  queue: max
jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: File the request
        env:
          NIBFIN_GITHUB_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
        run: node dashboard/src/sentry-relay/file/main.ts
