name: Sentry relay
# Deploys the Sentry relay Worker (dashboard/src/sentry-relay/) to Cloudflare and sets its
# secrets from this repository's secrets (#482). Nibfin's own experiment, not a product
# Worker. It triggers on push, so Nibfin waits for it as CD; an empty secret is skipped
# with a note so the run stays green. Re-run it by hand after SENTRY_CLIENT_SECRET is added.
on:
  push:
    branches: [main]
    paths:
      - dashboard/src/sentry-relay/**
      - dashboard/package.json
      - dashboard/package-lock.json
      - .github/workflows/sentry-relay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentry-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      # wrangler comes from the lockfile.
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Deploy
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config src/sentry-relay/wrangler.jsonc
      # A fine-grained token for gh-nibfin only, used for nothing but the dispatch.
      - name: Set the relay's GitHub token
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_TOKEN: ${{ secrets.SENTRY_RELAY_GITHUB_TOKEN }}
        run: |
          if [[ -z "$RELAY_TOKEN" ]]; then
            echo "SENTRY_RELAY_GITHUB_TOKEN is not set; the relay cannot dispatch yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$RELAY_TOKEN" | npx wrangler secret put GITHUB_TOKEN --config src/sentry-relay/wrangler.jsonc
      # The internal integration's client secret; until it is set the Worker rejects every request.
      - name: Set the Sentry client secret
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_SECRET: ${{ secrets.SENTRY_CLIENT_SECRET }}
        run: |
          if [[ -z "$CLIENT_SECRET" ]]; then
            echo "SENTRY_CLIENT_SECRET is not set; the relay rejects every request until it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$CLIENT_SECRET" | npx wrangler secret put SENTRY_CLIENT_SECRET --config src/sentry-relay/wrangler.jsonc
