name: Nibfin Issue wake
on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - reopened
      - closed
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-event-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake:
    uses: "taco3064/nibfin-core/.github/workflows/issue.yml@\
      35896f9a40fa9ffd0117944a439be91a0b8995fa"
    with:
      core_commit: 35896f9a40fa9ffd0117944a439be91a0b8995fa
    secrets:
      NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
      NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
