name: Nibfin adopted dispatch
# Core source: 5bf1dff83a21df3b92391105469a13921f62476d
on:
  workflow_dispatch:
    inputs:
      issue_number: { required: true, type: string }
      issue_id: { required: false, type: string }
      repository_id: { required: false, type: string }
      stage: { required: false, type: string, default: continue }
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-${{ github.repository_id }}-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  adopted-stage:
    runs-on: [self-hosted, Linux, nibfin-user-127829492]
    timeout-minutes: 180
    steps:
      - uses: "taco3064/nibfin-act@\
          50174ffd7f7a43099a50131e12995e521cdb447a"
        with:
          issue-number: ${{ inputs.issue_number }}
          stage: ${{ inputs.stage }}
