name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # No hosted macOS job: it is often cancelled for lack of capacity, and Nibfin
        # reads such a cancel as a CI or CD failure. Linux checks the macOS build below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./...
      - name: Check the macOS build
        if: runner.os == 'Linux'
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go vet ./...
          go build -trimpath ./...
