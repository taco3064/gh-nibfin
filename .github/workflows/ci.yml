name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # TEMPORARY: the Windows job turns off the Green Tea GC. On GitHub's Windows
    # runners Go 1.27 corrupts its heap and crashes about 4% of runs (golang/go#81238).
    # Remove this env when go.mod moves to the Go release with the fix (expected 1.27.5,
    # backport golang/go#82978). Tracked in gh-nibfin #523.
    env:
      GOEXPERIMENT: ${{ matrix.os == 'windows-latest' && 'nogreenteagc' || '' }}
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # No hosted macOS job: it is often cancelled for lack of capacity, and Nibfin
        # reads such a cancel as a CI or CD failure. Linux checks the macOS build below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      # The Dashboard frontend builds into internal/dashboard/dist/ before the Go steps,
      # so they embed it. Skipped until dashboard/ exists. Node matches the Job image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: hashFiles('dashboard/package-lock.json') != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: Dashboard install
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm ci
      - name: Dashboard build
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm run build
      - name: Dashboard typecheck
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm run typecheck
      - name: Dashboard lint
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm run lint
      - name: Dashboard unit tests
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm test
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath ./...
      - name: Check the macOS build
        if: runner.os == 'Linux'
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          go vet ./...
          go build -trimpath ./...
