name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository owner as PR author
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          if (process.env.EVENT_NAME === 'pull_request' && process.env.PR_AUTHOR_ID !== process.env.OWNER_ID) {
            console.error('Only the repository owner may submit a mergeable pull request.');
            process.exit(1);
          }
          NODE
  cli:
    needs: owner-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Run retained CLI and provider tests with networking denied
        run: python3 tooling/check.py
      - name: Verify the immutable installed Core observation contract offline
        run: node docs/handoffs/n15/verify.mjs
      - name: Verify the immutable installed registration response contract offline
        run: node docs/handoffs/n17/verify.mjs
      - name: Verify current public package and registration-scope admission contracts offline
        run: node --test test/current/*.mjs
