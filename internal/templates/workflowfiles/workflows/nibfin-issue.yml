# Generated by gh nibfin from taco3064/nibfin-core@30e890d
# (.github/workflows/nibfin-issue.yml with the job of nibfin-events.yml inlined).
# Update it with `gh nibfin upgrade`.
name: Nibfin · Issue events

# Wakes the Issue an event belongs to; Core decides what runs. It also runs on every
# push to the default branch, which is the "Nibfin ·" push run CD detection waits for.
# A review submitted on a same-repository nibfin/issue-* pull request wakes its Issue
# by branch, so Core re-checks a pull request that waits for a required approval.
# Events only wake an Issue: each one becomes a route run of the execution
# repository's nibfin-shared-runner.yml. Event text reaches the script only through env.
run-name: >-
  ${{ github.event.issue
  && format('Nibfin · {0}#{1} · wake', github.repository, github.event.issue.number)
  || format('Nibfin · {0}@{1} · wake', github.repository,
  github.event.workflow_run && (github.event.workflow_run.event == 'pull_request'
  && github.event.workflow_run.head_branch || github.event.workflow_run.head_sha)
  || github.event.pull_request.head.ref || github.event.check_suite.head_branch
  || github.event.sha || github.sha) }}

on:
  issues:
    types: [opened, reopened, closed, assigned, unassigned, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
[[- if .Workflows ]]
  workflow_run:
    # Every workflow that runs on push to the default branch or produces a required check.
    workflows: [[ .Workflows ]]
    types: [completed]
[[- end ]]
  check_suite:
    types: [completed]
  status:
  push:
    branches: [[ .Branches ]]

permissions: {}

jobs:
  wake:
    name: wake
    runs-on: ubuntu-24.04
    steps:
      - name: Wake the Issue
        env:
          GH_TOKEN: ${{ secrets.NIBFIN_GITHUB_TOKEN }}
          EXECUTION_REPO: ${{ vars.NIBFIN_EXECUTION_REPO }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SUITE_APP: ${{ github.event.check_suite.app.slug }}
          SUITE_BRANCH: ${{ github.event.check_suite.head_branch }}
          STATUS_SHA: ${{ github.event.sha }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          require_execution_repo() {
            if [ -z "$EXECUTION_REPO" ]; then
              echo "The variable NIBFIN_EXECUTION_REPO is not set" >&2
              exit 1
            fi
          }
          # A review is filtered to Nibfin's own pull requests before the variable is needed.
          if [ "$EVENT_NAME" != pull_request_review ]; then
            require_execution_repo
          fi
          # Ends the run unrouted unless the sender has admin or write permission.
          # A failed permission read fails the run.
          require_writer() {
            local permission
            permission=$(gh api "repos/$REPO/collaborators/$SENDER/permission" \
              --jq .permission)
            case "$permission" in
              admin | write) ;;
              *)
                echo "$SENDER has $permission permission; not routed"
                exit 0
                ;;
            esac
          }
          wake() {
            local inputs=(-f stage=route -f "repo=$REPO")
            for pair in "$@"; do
              inputs+=(-f "$pair")
            done
            gh workflow run nibfin-shared-runner.yml --repo "$EXECUTION_REPO" "${inputs[@]}"
            echo "Woke $REPO: $*"
          }
          case "$EVENT_NAME" in
            issues)
              if ! jq -e 'index("scope") != null or index("request") != null' <<<"$ISSUE_LABELS" >/dev/null; then
                echo "#$ISSUE has no scope or request label; not routed"
                exit 0
              fi
              case "$ACTION:$LABEL" in
                labeled:shaped | unlabeled:shaped | labeled:delivered | \
                  unlabeled:delivered | labeled:pending)
                  echo "Nibfin's own label change ($ACTION $LABEL); not routed"
                  exit 0
                  ;;
              esac
              require_writer
              wake "issue=$ISSUE"
              ;;
            pull_request_review)
              case "$REVIEW_BRANCH" in
                nibfin/issue-*) ;;
                *) exit 0 ;;
              esac
              if [ "$REVIEW_HEAD_REPO" != "$REPO" ]; then
                echo "A review on a pull request from ${REVIEW_HEAD_REPO:-an unknown repository}; not routed"
                exit 0
              fi
              require_execution_repo
              require_writer
              wake "branch=$REVIEW_BRANCH" "ref=$REVIEW_BRANCH"
              ;;
            workflow_run)
              if [ "$RUN_EVENT" = pull_request ]; then
                case "$RUN_BRANCH" in
                  nibfin/issue-*) ;;
                  *) exit 0 ;;
                esac
                if [ "$RUN_HEAD_REPO" != "$REPO" ]; then
                  echo "A pull request from $RUN_HEAD_REPO; not routed"
                  exit 0
                fi
                wake "branch=$RUN_BRANCH" "ref=$RUN_BRANCH"
              else
                wake "sha=$RUN_SHA" "ref=$RUN_SHA"
              fi
              ;;
            check_suite)
              if [ "$SUITE_APP" = github-actions ] || [ -z "$SUITE_BRANCH" ]; then
                exit 0
              fi
              wake "branch=$SUITE_BRANCH" "ref=$SUITE_BRANCH"
              ;;
            status)
              wake "sha=$STATUS_SHA" "ref=$STATUS_SHA"
              ;;
            push)
              if [ "$PUSH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                exit 0
              fi
              wake "sha=$PUSH_SHA" "ref=$PUSH_SHA"
              ;;
            *)
              echo "The $EVENT_NAME event is not routed"
              ;;
          esac
